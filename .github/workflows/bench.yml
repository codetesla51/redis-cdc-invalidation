# Ephemeral benchmark: spins up Postgres + Valkey + producer + consumer on one
# throwaway VM, floods it, uploads the report, then the VM is dropped.
# Same-box numbers are relative (see docs/benchmarks.md) — this gates
# regressions and proves shape, not absolute capacity.
name: Bench
on:
  workflow_dispatch:

jobs:
  flood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Start Postgres (logical replication) + Valkey
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 postgres:16 -c wal_level=logical -c max_connections=200
          docker run -d --name cache -p 6379:6379 valkey/valkey:8
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres && break || sleep 2
          done

      - name: Seed database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE redis_cdc;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d redis_cdc \
            -c "CREATE TABLE products (id TEXT PRIMARY KEY, name TEXT NOT NULL, updated_at TIMESTAMPTZ NOT NULL DEFAULT now());"

      - name: Box specs
        run: |
          echo "cpus: $(nproc)"; free -h | head -n 2
          grep -m1 "model name" /proc/cpuinfo; grep -m1 "cpu MHz" /proc/cpuinfo

      - name: Build + start producer and consumer
        run: |
          go build -o cdc-load ./...
          export DATABASE_URL='postgres://postgres:postgres@localhost:5432/redis_cdc'
          TABLES='products' MODE=produce STREAM=cdc CHANGE_BUFFER_SIZE=5000 \
            ./cdc-load > producer.log 2>&1 &
          MODE=consume STREAM=cdc ./cdc-load > consumer.log 2>&1 &
          sleep 8
          curl -s -m 5 http://localhost:8080/metrics/stream | head -n 1

      - name: Install barrage
        run: curl -fsSL https://raw.githubusercontent.com/codetesla51/barrage/main/install.sh | bash -s -- --version v0.6.3

      - name: Ladder (50k, 100k, 1M — sequential, never parallel)
        run: |
          sed 's#postgres://postgres@localhost#postgres://postgres:postgres@localhost#' \
            benchmarks/flood-wide.yaml > /tmp/flood-ci.yaml
          sed -e 's#postgres://postgres@localhost#postgres://postgres:postgres@localhost#' \
              -e 's/^duration:.*/duration: 60s/' benchmarks/flood-wide.yaml > /tmp/flood-100k.yaml
          sed -e 's#postgres://postgres@localhost#postgres://postgres:postgres@localhost#' \
            benchmarks/flood-1m.yaml > /tmp/flood-1m-ci.yaml
          ~/.local/bin/barrage run -c /tmp/flood-ci.yaml \
            --json bench-50k.json --report report-50k.html 2>&1 | tail -n 3
          ~/.local/bin/barrage run -c /tmp/flood-100k.yaml \
            --json bench-100k.json --report report-100k.html 2>&1 | tail -n 3
          ~/.local/bin/barrage run -c /tmp/flood-1m-ci.yaml \
            --json bench-1m.json --report report-1m.html 2>&1 | tail -n 3
          sleep 5
          curl -s -m 5 http://localhost:8080/metrics/stream | head -n 1

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench-*.json
            report-*.html
            producer.log
            consumer.log
